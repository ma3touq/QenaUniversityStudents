plugins {
    id 'com.android.application'
}

android {
    namespace 'eg.qu.edu.studentportal'
    compileSdk 35

    defaultConfig {
        applicationId 'eg.qu.edu.studentportal'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
    debug {
        applicationIdSuffix '.webviewtest'
    }
    release {
        minifyEnabled false
    }
}
